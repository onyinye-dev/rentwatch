name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Format, lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f # v2.0.0

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Unit tests
        run: cargo test --locked

  dataset:
    name: Dataset is well formed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Every line must be a JSON object. A malformed record would otherwise
      # only surface when someone ran `rentwatch report`.
      - name: Validate measurements.jsonl
        run: |
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            printf '%s' "$line" | python3 -c 'import json,sys; json.loads(sys.stdin.read())'
          done < data/measurements.jsonl
          echo "$(grep -c . data/measurements.jsonl) measurements parse cleanly"
